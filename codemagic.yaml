workflows:
  android-universal-band:
    name: Universal Band Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
      node: 22
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web app
        script: |
          npm run build
      - name: Ensure Capacitor Android project & gradlew
        script: |
          if [ ! -f "android/gradlew" ] || [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Capacitor Android project files while preserving custom Android sources..."
            if [ -d "android" ]; then
              mv android android_custom_backup
            fi
            npx cap add android
            if [ -d "android_custom_backup" ]; then
              rsync -a android_custom_backup/ android/
              rm -rf android_custom_backup
            fi
          fi
          if [ -f "google-services.json" ]; then
            mkdir -p android/app
            cp -f google-services.json android/app/google-services.json
          fi
          npx cap sync android
      - name: Set Android SDK location
        script: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          echo "sdk.dir=$SDK_DIR" > android/local.properties
          echo "Using Android SDK at: $SDK_DIR"
      - name: Build Android APK
        script: |
          cd android
          ls -la
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - tetelophokwane98@gmail.com
        notify:
          success: true
          failure: true
